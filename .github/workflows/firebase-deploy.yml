name: Deploy to Firebase Hosting

# Auto-deploys the site to Firebase Hosting every time this branch is
# pushed. Requires the FIREBASE_SERVICE_ACCOUNT and FIREBASE_PROJECT_ID
# secrets to be set (Repo Settings > Secrets and variables > Actions) —
# see the "Auto-deploy setup" section in README.md.

on:
  push:
    branches:
      - bridgets-boutique-website-86pp8x

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: "${{ secrets.FIREBASE_PROJECT_ID }}"
          channelId: live
